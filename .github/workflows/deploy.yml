name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  # Gerbang sebelum apa pun menyentuh produksi.
  #
  # Migrasi berjalan lebih dulu di deploy-backend, jadi push yang rusak bukan
  # hanya gagal terpasang — skema produksi sudah terlanjur berubah saat
  # kegagalannya ketahuan. Uji dan pemeriksaan tipe karena itu harus lulus
  # sebelum kedua pekerjaan deploy boleh mulai.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # node:sqlite dipakai uji rute untuk menjalankan migrasi sungguhan.
          node-version: '22'

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # Dua konfigurasi: kode Worker diperiksa tanpa tipe Node sama sekali,
      # supaya API yang tidak ada di runtime produksi ketahuan di sini.
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Test backend
        working-directory: backend
        run: npm test -- --run

      # Backend-nya ikut diuji di luar UTC, dengan alasan yang sama seperti
      # frontend di bawah — dan karena celah ini pernah kebobolan: `getMondayOf`
      # membangun tanggal pada tengah malam waktu lokal lalu mengembalikannya
      # lewat `toISOString()`, yang membacanya sebagai UTC. Di runner dan di
      # Cloudflare yang sama-sama UTC keduanya kebetulan cocok, jadi uji hijau
      # sementara fungsinya mengembalikan pekan yang salah di mana pun selain
      # UTC. Dua arah dijalankan karena kedua sisi salahnya berbeda: zona di
      # timur menggeser tanggal mundur, zona di barat menggesernya maju.
      - name: Test backend (zona waktu lain)
        working-directory: backend
        run: |
          TZ=Pacific/Kiritimati npm test -- --run
          TZ=America/Los_Angeles npm test -- --run

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      # Dijalankan ulang di zona yang jauh dari WIB. Tanggal di aplikasi ini
      # selalu WIB karena backend menyimpannya begitu; uji yang hanya lulus
      # di satu zona berarti ada kode yang diam-diam memakai zona perangkat,
      # dan salahnya baru terlihat sebagai catatan bertanggal kemarin.
      - name: Test frontend (zona waktu lain)
        working-directory: frontend
        env:
          TZ: America/New_York
        run: npm test -- --run

  deploy-backend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # Migrations run first. The other order put the new Worker live against the
      # old schema for as long as the migration took, so a release that adds a
      # table served 500s on every route reading it until the step caught up.
      # The migrations are additive and idempotent, so applying them ahead of
      # the deploy is safe for the running version.
      - name: Run DB migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:remote

      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

  deploy-frontend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Scoped API tokens cannot read /memberships, so wrangler cannot
          # discover the account on its own — it has to be named here.
          accountId: 55f322d1725346acdc018b7197bd71f4
          wranglerVersion: '4.103.0'
          workingDirectory: frontend
          command: pages deploy dist --project-name=fayolla --branch=main
